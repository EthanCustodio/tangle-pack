[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanglepack"
version = "0.1.0"
description = "A simple tangle package"
authors = [
  { name="Your Name", email="your.email@example.com" }
]

dependencies = [
  "asttokens==3.0.0",
  "comm==0.2.2",
  "contourpy==1.3.1",
  "coverage==7.8.0",
  "cycler==0.12.1",
  "debugpy==1.8.12",
  "decorator==5.1.1",
  "executing==2.2.0",
  "fonttools==4.56.0",
  "iniconfig==2.0.0",
  "ipykernel==6.29.5",
  "ipympl==0.10.0",
  "ipython==8.32.0",
  "jedi==0.19.2",
  "jupyter_client==8.6.3",
  "jupyter_core==5.7.2",
  "kiwisolver==1.4.8",
  "matplotlib==3.10.0",
  "matplotlib-inline==0.1.7",
  "nest-asyncio==1.6.0",
  "numpy==2.2.5",
  "packaging==24.2",
  "parso==0.8.4",
  "pexpect==4.9.0",
  "pillow==11.1.0",
  "platformdirs==4.3.6",
  "pluggy==1.5.0",
  "prompt_toolkit==3.0.50",
  "psutil==7.0.0",
  "ptyprocess==0.7.0",
  "pure_eval==0.2.3",
  "py-spy==0.4.0",
  "Pygments==2.19.1",
  "pyparsing==3.2.1",
  "pytest==8.3.4",
  "pytest-cov==6.1.1",
  "python-dateutil==2.9.0.post0",
  "pyzmq==26.2.1",
  "rtree==1.4.0",
  "scipy==1.15.1",
  "shapely==2.1.0",
  "six==1.17.0",
  "snakeviz==2.2.2",
  "stack-data==0.6.3",
  "tornado==6.4.2",
  "traitlets==5.14.3",
  "wcwidth==0.2.13"
]

[project.optional-dependencies]
# GPU acceleration for the batched map evaluation (see tanglepack.enable_gpu).
# Pick the wheel matching your CUDA toolkit, e.g. cupy-cuda12x.
gpu = ["cupy-cuda12x"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running growth/blast integration tests",
  "regression: pins a known bug (xfail until fixed)",
]


[project.scripts]
tanglepack-gui = "tanglepack_gui.app:main"
tanglepack-dash = "tanglepack_webdash.app:main"