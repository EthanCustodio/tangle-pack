[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanglepack"
version = "0.1.0"
description = "Compute and visualize heteroclinic/homoclinic tangles of 2D area-preserving maps"
authors = [
  { name="Ethan Custodio", email="etccustodio@gmail.com" }
]

# Direct runtime dependencies only (what the packages actually import).
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "rtree>=1.3",
  "shapely>=2.0",
  "networkx>=3.3",
  # web dashboard (tanglepack_webdash / tanglepack-dash)
  "dash>=3.0",
  "dash-extensions>=1.0",
  "plotly>=6.0",
  "sympy>=1.12",
]

[project.optional-dependencies]
# GPU acceleration for the batched map evaluation (see tanglepack.enable_gpu).
# Pick the wheel matching your CUDA toolkit, e.g. cupy-cuda12x.
gpu = ["cupy-cuda12x"]
# PySide6 GUI (tanglepack-gui); kept optional, the dashboard is the main frontend.
gui = ["PySide6"]
# Development tools: tests, profiling, notebooks.
dev = [
  "pytest>=8",
  "pytest-cov",
  "py-spy",
  "snakeviz",
  "ipykernel",
  "ipympl",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running growth/blast integration tests",
  "regression: pins a known bug (xfail until fixed)",
]


[project.scripts]
tanglepack-gui = "tanglepack_gui.app:main"
tanglepack-dash = "tanglepack_webdash.app:main"