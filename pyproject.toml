[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanglepack"
version = "0.1.0"
description = "Compute and visualize heteroclinic/homoclinic tangles of 2D area-preserving maps"
authors = [
  { name="Ethan Custodio", email="etccustodio@gmail.com" }
]

# Direct runtime dependencies only (what the package actually imports).
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "rtree>=1.3",
  "networkx>=3.3",
]

[project.optional-dependencies]
# GPU acceleration for the batched map evaluation (see tanglepack.enable_gpu).
# Pick the wheel matching your CUDA toolkit, e.g. cupy-cuda12x.
gpu = ["cupy-cuda12x"]
# Development tools: tests, profiling, notebooks.
dev = [
  "pytest>=8",
  "pytest-cov",
  "py-spy",
  "snakeviz",
  "ipykernel",
  "ipympl",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not perf'"
markers = [
  "slow: long-running growth/blast integration tests",
  "regression: pins a previously fixed bug",
  "golden: an author-gated fixture fact (CLAUDE.md); runs by default, changes only with the author's sign-off",
  "perf: a timing/scaling test; opt-in (pytest -m perf), excluded by default",
]
